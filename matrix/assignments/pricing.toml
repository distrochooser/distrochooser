# distrochooser::translation::en::Usable without fee
# distrochooser::translation::key::without-fee-facette-pricing-free-description
[assignment.without-fee-facette-pricing-free]
facettes = ["pricing-free"]
choosables = [
    "ubuntu",
    "debian",
    "tails",
    "devuan",
    "arch",
    "mint",
    "opensuse",
    "solus",
    "manjaro",
    "pclinuxos",
    "rocky",
    "MXLinux",
    "Fedora",
    "Gentoo",
    "Knoppix",
    "CruxLinux",
    "ZorinOS",
    "elementaryos",
    "qubesos",
    "nixOS",
    "Xubuntu",
    "Lubuntu",
    "UbuntuMATE",
    "void",
    "artix",
    "kubuntu",
    "popos",
    "deepin",
    "bazzite",
    "nobara",
    "cachyos",
    "emmabuntus",
    "parrot"
]
how = "positive"

[assignment.requires-payment-facette-pricing-free]
facettes = ["pricing-free"]
choosables = ["rhel"]
how = "blocking"

[assignment.zorin-pro]
facettes = ["paid-support-ok"]
choosables = ["zorinos"]
how = "positive"
sources = [
    "zorinos;https://zorin.com/os/pro/"
]

[assignment.elementary-os-pay-what-you-can]
facettes = ["paid-support-ok"]
choosables = ["elementaryos"]
how = "positive"
sources = [
    "elementaryos;https://elementary.io/"
]

[assignment.ubuntu-pro]
facettes = ["paid-support-ok"]
choosables = ["ubuntu"]
how = "positive"
sources = [
    "ubuntu;https://ubuntu.com/pricing/pro"
]

[assignment.suse-enterprise]
facettes = ["paid-support-ok"]
choosables = ["opensuse"]
how = "positive"
sources = [
    "opensuse;https://www.suse.com/shop/desktop/" 
]