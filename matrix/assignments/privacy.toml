# https://fedoramagazine.org/getting-better-at-counting-rpm-ostree-based-systems/
# https://discuss.privacyguides.net/t/bazzite-ships-with-telemetry-enabled/27283/2
# https://fedoraproject.org/wiki/Changes/Telemetry
# https://forums.rockylinux.org/t/the-usage-situation-of-rocky-linux/17439/25
# https://coreos.github.io/rpm-ostree/countme/
[assignment.fedora-dnf-countme]
facettes = ["no-telemetry"]
choosables = [
    "fedora",
    "bazzite"
]
how = "negative"
sources = [
    "fedora;https://fedoraproject.org/wiki/Changes/DNF_Better_Counting",
    "bazzite;https://discuss.privacyguides.net/t/bazzite-ships-with-telemetry-enabled/27283/2",
    "rocky;https://forums.rockylinux.org/t/the-usage-situation-of-rocky-linux/17439/26"
]

# Basically a similar situation as with Debian popcon, but as 
# the popcon will ask for install, here it's enabled and the user 
# can opt out (which is imo completely fine) - but it's no opt-in
# therefore we will map it here as blocking as this is also a persistent ping

