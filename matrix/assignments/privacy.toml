# We consider opt-out as a negative
# We consider an repeating mechansism as blocking (e. g. daily or hourly ping)

# For Pop!OS, no known telemetry could be found, but a confusing thread on reddit https://www.reddit.com/r/pop_os/comments/1pblbk8/telemetry/
# For MX Linux, there are claims around telemetry, but I cannot find any proof for that beside the popcon being available to install

# We will consider distros doing no telemetry
# until proven otherwise
[assignment.no-known-telemetry]
facettes = ["no-telemetry"]
choosables = [
    "artix",
    "emmabuntus",
    "nobara",
    "cachyos",
    "asahi", 
    "popos",
    "nixos",
    "manjaro",
    "pclinuxos",
    "mint",
    "cruxlinux",
    "mxlinux",
    "gentoo",
    "knoppix"
]
how = "positive"
sources = [
    "cachyos;https://discuss.cachyos.org/t/cachy-os-telemetry/29429",
    "manjaro;https://forum.manjaro.org/t/whatever-happened-to-mdd/186715/6"
]

# General mapping for privacy focused distros
[assignment.general-privacy-focused]
facettes = ["privacy-focused"]
choosables = [
    "tails",
    "qubesos",
    "parrot"
]
how = "positive"
sources = [
    "tails;https://tails.net/about/index.en.html"
]

