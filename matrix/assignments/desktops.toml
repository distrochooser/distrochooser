[assignment.gnome-default]
facettes = ["desktop-gnome"]
choosables = [
    "ubuntu",
    "zorinos",
    "nobara",
    "tails",
    "opensuse",
    "fedora",
    "rhel"
]
how = "positive"
sources = [
    "ubuntu;https://ubuntu.com/blog/ubuntu-desktop-24-04-noble-numbat-deep-dive",
    "nobara;https://nobaraproject.org/",
    "zorinos;https://en.wikipedia.org/wiki/Zorin_OS",
    "tails;https://tails.net/doc/first_steps/desktop/index.en.html",
    "opensuse;https://en.wikipedia.org/wiki/OpenSUSE",
    "fedora;https://fedoraproject.org/workstation/",
    "rhel;https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/8/htmlsingle/using_the_desktop_environment_in_rhel_8/customizing-default-favorite-applications_using-the-desktop-environment-in-rhel-8"
]

